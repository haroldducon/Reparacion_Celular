# Blueprint de Render para el backend (NestJS + Prisma + Neon).
# Las variables con sync:false las escribes tú en el panel de Render (no se guardan en Git).
services:
  - type: web
    name: taller-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: Render pone NODE_ENV=production y, sin esto, no instala Prisma CLI / Nest CLI / TypeScript
    buildCommand: npm ci --include=dev && npm run build
    # aplica migraciones pendientes y arranca
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
